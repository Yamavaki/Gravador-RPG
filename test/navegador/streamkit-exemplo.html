<!doctype html>
<html><head><meta charset="utf-8"><title>Voice Widget (exemplo)</title></head>
<body>

  <ul class="voice-states">

      <img class="avatar speaking" src="https://cdn.discordapp.com/avatars/187691838138400768/a1b2c3.png">
      <div class="user"><span class="name">ana_rpg</span></div>
    </li>
    <li class="voice-state" data-reactid=".0.0.$298765432109876543">
      <img class="avatar" src="https://cdn.discordapp.com/embed/avatars/3.png">
      <div class="user"><span class="name">Beto#Gamer</span></div>
    </li>
    <li class="voice-state">
      <img class="avatar" src="https://cdn.discordapp.com/avatars/311111111111111111/zz.webp?size=128">
      <div class="user"><span class="name">Gustavo</span></div>
    </li>
  </ul>
</div>
</body></html>
